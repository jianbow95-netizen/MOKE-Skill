<header><div class="brand"><button class="ghost mobile-only" id="projectsToggle">☰</button><div class="logo">✳</div><div><b>三十 · 创作画布</b><small>CONNECTED CREATIVE WORKSPACE</small></div></div><div class="header-actions"><span class="save" id="sync">连接中…</span><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><button id="exportButton">导出项目</button><button id="importButton">导入</button><button id="inspectorToggle" class="mobile-only">编辑</button><button id="uploadButton" class="accent">＋ 图片</button></div></header>

<script>

const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),clone=o=>structuredClone(o);const colors=['sage','blue','rose','amber','violet','gray'];const colorHex={sage:'#b8d57d',blue:'#7db6df',rose:'#d58ea2',amber:'#d8b374',violet:'#b89cdf',gray:'#9babbc'};
let board={nodes:[],edges:[],groups:[],projects:[]},pid=localStorage.getItem('sanshi-project')||'default',selected=new Set(),edgeSelection=null,groupSelection=null,view={x:90,y:100,s:.85},mode='select',snap=true,space=false,drag=null,busy=false,refreshing=false,inspectorKey='',toastTimer,clipboard=null,miniBounds=null,projectViews={},lastPointer={x:0,y:0},draftDirty=false,pendingDraft=null,draftSaving=null,draftTimer=null,actionQueue=Promise.resolve(),pendingActions=0;

async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!(r.headers.get('content-type')||'').includes('json'))throw Error('请刷新网页并登录');const data=await r.json();if(!r.ok)throw Error(data.error||'操作失败');return data}
function adopt(data,force=false){if(!force&&data.project_id!==pid)return;board=data;pid=data.project_id;localStorage.setItem('sanshi-project',pid);selected=new Set([...selected].filter(id=>board.nodes.some(n=>n.id===id)));if(edgeSelection&&!board.edges.some(e=>e.id===edgeSelection))edgeSelection=null;if(groupSelection&&!board.groups.some(g=>g.id===groupSelection))groupSelection=null;render()}
function action(body,{force=false}={}){const project_id=body.project_id||pid;pendingActions++;busy=true;$('sync').textContent='保存中…';const job=actionQueue.catch(()=>{}).then(async()=>{try{const data=await api('mutate',{project_id,...body});adopt(data,force);$('sync').textContent='已保存';return data}finally{pendingActions--;busy=pendingActions>0}});actionQueue=job;return job}

function render(){renderProjects();renderCards();renderEdges();renderFrames();renderLibrary();$('projectName').textContent=board.name||'创作画布';const tasks=board.nodes.filter(n=>['queued','processing'].includes(n.status));$('taskCount').textContent=board.nodes.length+' 个节点 · '+board.edges.length+' 条连线'+(tasks.length?' · '+tasks.length+' 个待处理':'');$('empty').style.display=board.nodes.length?'none':'block';$('undo').disabled=!board.undoCount;$('redo').disabled=!board.redoCount;$('selectionTools').style.display=selected.size>1?'flex':'none';renderInspector();drawMini()}

function drawMini(){const canvas=$('minimap'),ctx=canvas.getContext('2d');if(!ctx)return;ctx.clearRect(0,0,canvas.width,canvas.height);const visible={x:-view.x/view.s,y:-view.y/view.s,w:vp.clientWidth/view.s,h:vp.clientHeight/view.s};const all=bounds([...board.nodes,...board.groups,visible],80),scale=Math.min(canvas.width/all.w,canvas.height/all.h),ox=(canvas.width-all.w*scale)/2,oy=(canvas.height-all.h*scale)/2;miniBounds={...all,scale,ox,oy};for(const g of board.groups){ctx.fillStyle=colorHex[g.color]+'18';ctx.fillRect((g.x-all.x)*scale+ox,(g.y-all.y)*scale+oy,g.w*scale,g.h*scale)}for(const e of board.edges){const a=board.nodes.find(n=>n.id===e.from),b=board.nodes.find(n=>n.id===e.to);if(!a||!b)continue;ctx.strokeStyle='#577045';ctx.beginPath();ctx.moveTo((a.x+a.w-all.x)*scale+ox,(a.y+a.h/2-all.y)*scale+oy);ctx.lineTo((b.x-all.x)*scale+ox,(b.y+b.h/2-all.y)*scale+oy);ctx.stroke()}for(const n of board.nodes){ctx.fillStyle=selected.has(n.id)?'#d7ee98':colorHex[n.color||'gray']+'aa';ctx.fillRect((n.x-all.x)*scale+ox,(n.y-all.y)*scale+oy,Math.max(2,n.w*scale),Math.max(2,n.h*scale))}ctx.strokeStyle='#c6d3bb';ctx.lineWidth=2;ctx.strokeRect((visible.x-all.x)*scale+ox,(visible.y-all.y)*scale+oy,visible.w*scale,visible.h*scale)}
$('minimap').addEventListener('pointerdown',e=>{e.stopPropagation();if(!miniBounds)return;const r=e.target.getBoundingClientRect(),px=(e.clientX-r.left)*e.target.width/r.width,py=(e.clientY-r.top)*e.target.height/r.height,b=miniBounds,x=(px-b.ox)/b.scale+b.x,y=(py-b.oy)/b.scale+b.y;view.x=vp.clientWidth/2-x*view.s;view.y=vp.clientHeight/2-y*view.s;transform();saveView()});
function dialog(title,content,buttons){$('modalTitle').textContent=title;$('modalBody').replaceChildren(...content);$('modalActions').replaceChildren(button('取消',closeDialog),...buttons);$('modal').classList.add('open');setTimeout(()=>$('modalBody').querySelector('input,textarea')?.focus(),30)}function closeDialog(){$('modal').classList.remove('open')}
function projectDialog(kind){const p=board.projects.find(p=>p.id===pid);const name=input('projectInput',kind==='new'?'':kind==='duplicate'?p.name+' · 副本':kind==='delete'?'':p.name);name.maxLength=80;const title={new:'新建项目',rename:'重命名项目',duplicate:'复制整个项目',delete:'删除项目'}[kind];const desc=el('p','',kind==='delete'?'删除项目会移除它的节点、连线和任务。请输入项目名称「'+p.name+'」确认。':'每个项目独立保存节点、连线、分组与操作历史。');dialog(title,[desc,field(kind==='delete'?'输入项目名称':'项目名称',name)],[button(kind==='delete'?'确认删除':'保存',async()=>{try{await saveDraft();saveView();let data;if(kind==='new')data=await action({op:'project_create',id:uid(),name:name.value},{force:true});if(kind==='rename')data=await action({op:'project_rename',name:name.value});if(kind==='duplicate')data=await action({op:'project_duplicate',name:name.value},{force:true});if(kind==='delete')data=await action({op:'project_delete',confirm_name:name.value},{force:true});closeDialog();selectionClear();inspectorKey='';view=projectViews[pid]||{x:90,y:100,s:.85};render();transform()}catch(e){toast(e.message)}},kind==='delete'?'danger':'accent')])}
function makeGroup(){if(!selected.size){toast('请先选择节点');return}const name=input('groupName','创作分组');dialog('将节点分组',[field('分组名称',name)],[button('创建分组',async()=>{const r=await safe({op:'group',ids:[...selected],title:name.value,color:'sage'});if(r){closeDialog();selectionClear();groupSelection=r.groups.at(-1).id;inspectorKey='';render()}},'accent')])}
async function remove(){const ids=edgeSelection?[edgeSelection]:groupSelection?[groupSelection]:[...selected];if(!ids.length)return;const r=await safe({op:'delete',ids});if(r){selectionClear();inspectorKey='';render()}}
async function duplicate(){if(!selected.size)return;const previous=new Set(board.nodes.map(n=>n.id)),r=await safe({op:'duplicate',ids:[...selected]});if(r){selected=new Set(r.nodes.filter(n=>!previous.has(n.id)).map(n=>n.id));inspectorKey='';render()}}
function copySelection(){if(!selected.size)return;clipboard={nodes:clone(board.nodes.filter(n=>selected.has(n.id))),edges:clone(board.edges.filter(e=>selected.has(e.from)&&selected.has(e.to))),groups:[]};toast('已复制 '+clipboard.nodes.length+' 个节点，可粘贴到其他项目')}
async function pasteSelection(){if(!clipboard)return;const previous=new Set(board.nodes.map(n=>n.id)),target=atCenter();const b=bounds(clipboard.nodes),graph=clone(clipboard);for(const n of graph.nodes){n.x+=target.x-b.x;n.y+=target.y-b.y}const r=await safe({op:'paste',graph});if(r){selected=new Set(r.nodes.filter(n=>!previous.has(n.id)).map(n=>n.id));inspectorKey='';render()}}
async function align(type){const nodes=board.nodes.filter(n=>selected.has(n.id)&&!n.locked);if(nodes.length<2)return;const b=bounds(nodes),patches=[];if(type==='distribute'){nodes.sort((a,b)=>a.x-b.x);const total=nodes.reduce((a,n)=>a+n.w,0),gap=Math.max(0,(b.w-total)/(nodes.length-1));let x=b.x;for(const n of nodes){patches.push({id:n.id,x,y:n.y});x+=n.w+gap}}else if(type==='grid'){const cols=Math.ceil(Math.sqrt(nodes.length)),w=Math.max(...nodes.map(n=>n.w))+60,h=Math.max(...nodes.map(n=>n.h))+60;nodes.sort((a,b)=>a.y-b.y||a.x-b.x).forEach((n,i)=>patches.push({id:n.id,x:b.x+(i%cols)*w,y:b.y+Math.floor(i/cols)*h}))}else for(const n of nodes)patches.push({id:n.id,x:type==='left'?b.x:n.x,y:type==='top'?b.y:type==='centerY'?b.y+b.h/2-n.h/2:n.y});await safe({op:'positions',patches})}
function download(n){if(!n.asset)return;const a=el('a');a.href='/api/asset/'+n.asset+'?download=1';a.download=n.title;a.click()}
async function upload(files){let i=0;for(const file of files){if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('请选择 PNG、JPEG 或 WebP 图片');continue}if(file.size>15*1024*1024){toast('单张图片最多 15 MB');continue}try{await saveDraft();const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const previous=new Set(board.nodes.map(n=>n.id)),p=atCenter();const data=await action({op:'upload',base64,name:file.name,x:p.x+i*360,y:p.y});selected=new Set(data.nodes.filter(n=>!previous.has(n.id)).map(n=>n.id));inspectorKey='';render();i++}catch(e){toast(e.message)}}$('file').value=''}
function processTasks(){const tasks=board.nodes.filter(n=>n.type==='task'&&['queued','processing'].includes(n.status));if(!tasks.length){toast('当前项目没有待处理任务');return}const prompt=el('textarea');prompt.readOnly=true;prompt.style.height='170px';prompt.value='请处理我的「三十 · 创作画布」项目「'+board.name+'」的待处理任务。项目 ID：'+pid+'，画布：'+location.origin+'。读取此项目和任务，先领取任务并按 refs 顺序查看图片，仅使用当前会话内置 imagegen。按提示词、参考图和画幅逐个生成，将真实输出回传原任务，不改变其他项目。任务 ID：'+tasks.map(n=>n.id).join('、');dialog('交给 ChatGPT 生图',[el('p','','复制指令并发送到 ChatGPT，结果会回到当前项目并保留连线。'),prompt],[button('复制指令',async()=>{try{await navigator.clipboard.writeText(prompt.value);toast('已复制，请发送到 ChatGPT')}catch{prompt.select();toast('请复制选中的指令')}},'accent'),button('打开 ChatGPT ↗',()=>window.open('https://chatgpt.com/','_blank','noopener'))])}
function hideContext(){$('context').style.display='none'}
vp.addEventListener('contextmenu',e=>{e.preventDefault();const card=e.target.closest('.card');if(card&&!selected.has(card.dataset.id))selectNode(card.dataset.id);const d=$('context');d.replaceChildren();if(selected.size){d.append(button('复制节点 Ctrl+C',()=>{copySelection();hideContext()}),button('创建副本 Ctrl+D',()=>{duplicate();hideContext()}),button('将节点分组 Ctrl+G',()=>{makeGroup();hideContext()}),button('查看选中节点',()=>{fit(board.nodes.filter(n=>selected.has(n.id)));hideContext()}),button('删除 Delete',()=>{remove();hideContext()},'danger'))}else{d.append(button('添加提示词',()=>{addNode('prompt');hideContext()}),button('添加文字',()=>{addNode('note');hideContext()}),button('粘贴节点 Ctrl+V',()=>{pasteSelection();hideContext()}),button('查看全部 F',()=>{fit();hideContext()}))}d.style.cssText='display:block;left:'+Math.min(e.clientX,window.innerWidth-180)+'px;top:'+Math.min(e.clientY,window.innerHeight-240)+'px'});document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context'))hideContext()});
$('newProject').onclick=()=>projectDialog('new');$('renameProject').onclick=()=>projectDialog('rename');$('duplicateProject').onclick=()=>projectDialog('duplicate');$('deleteProject').onclick=()=>projectDialog('delete');$('undo').onclick=()=>safe({op:'undo'});$('redo').onclick=()=>safe({op:'redo'});$('newPrompt').onclick=$('addPromptTool').onclick=()=>addNode('prompt');$('newNote').onclick=$('addNoteTool').onclick=()=>addNode('note');$('groupButton').onclick=$('quickGroup').onclick=makeGroup;$('selectTool').onclick=()=>setMode('select');$('handTool').onclick=()=>setMode('hand');$('connectTool').onclick=()=>setMode('connect');$('snap').onclick=()=>{snap=!snap;$('snap').classList.toggle('active',snap)};$('fit').onclick=()=>fit();$('minus').onclick=()=>zoomBy(1/1.2);$('plus').onclick=()=>zoomBy(1.2);$('resetZoom').onclick=()=>zoomBy(1/view.s);$('process').onclick=processTasks;$('uploadButton').onclick=()=>$('file').click();$('file').onchange=e=>upload(e.target.files);$('search').oninput=renderLibrary;$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;$('filters').dataset.filter=b.dataset.filter;for(const button of $('filters').children)button.classList.toggle('active',button===b);renderLibrary()};$('selectionTools').onclick=e=>{const b=e.target.closest('[data-align]');if(b)align(b.dataset.align)};$('projectsToggle').onclick=()=>$('left').classList.toggle('open');$('inspectorToggle').onclick=()=>$('right').classList.toggle('open');$('modal').onclick=e=>{if(e.target===$('modal'))closeDialog()};
vp.ondragover=e=>e.preventDefault();vp.ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files)};document.addEventListener('paste',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.clipboardData.files.length){e.preventDefault();upload(e.clipboardData.files)}else if(clipboard){e.preventDefault();pasteSelection()}else{const t=e.clipboardData.getData('text/plain');if(t.trim()){e.preventDefault();addNode('note',null,t)}}});
$('exportButton').onclick=async()=>{try{await saveDraft();const data=await api('export?project_id='+pid),url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=el('a');a.href=url;a.download=(board.name||'项目')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){toast(e.message)}};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>55*1024*1024)throw Error('项目文件过大');const project=JSON.parse(await f.text());await saveDraft();const data=await action({op:'import',project,new_project:true},{force:true});selectionClear();inspectorKey='';render();fit();toast('已导入为独立项目')}catch(e){toast(e.message)}e.target.value=''};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const mod=e.ctrlKey||e.metaKey,key=e.key.toLowerCase();if(e.code==='Space'){e.preventDefault();space=true;vp.classList.add('hand')}if(mod&&key==='z'){e.preventDefault();safe({op:e.shiftKey?'redo':'undo'})}else if(mod&&key==='y'){e.preventDefault();safe({op:'redo'})}else if(mod&&key==='a'){e.preventDefault();selected=new Set(board.nodes.map(n=>n.id));edgeSelection=groupSelection=null;inspectorKey='';render()}else if(mod&&key==='d'){e.preventDefault();duplicate()}else if(mod&&key==='g'){e.preventDefault();makeGroup()}else if(mod&&key==='c'){e.preventDefault();copySelection()}else if(mod&&key==='v'&&clipboard){e.preventDefault();pasteSelection()}else if(['Delete','Backspace'].includes(e.key)){e.preventDefault();remove()}else if(e.key==='Escape'){closeDialog();hideContext();setMode('select');selectionClear();inspectorKey='';render()}else if(!mod&&key==='v')setMode('select');else if(!mod&&key==='h')setMode('hand');else if(!mod&&key==='c')setMode('connect');else if(!mod&&key==='p')addNode('prompt');else if(!mod&&key==='n')addNode('note');else if(!mod&&key==='f')fit();});document.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;vp.classList.toggle('hand',mode==='hand')}});window.addEventListener('blur',()=>{space=false;vp.classList.toggle('hand',mode==='hand')});window.addEventListener('resize',drawMini);window.addEventListener('beforeunload',e=>{if(busy||draftDirty){e.preventDefault();e.returnValue=''}});transform();refresh();setInterval(refresh,7000);
